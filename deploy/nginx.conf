server {
    listen 80;
    listen [::]:80;
    server_name yildirimreklam.tr www.yildirimreklam.tr;

    root /var/www/yildirimreklam.tr;
    index index.html;

    # Tek sayfalık site (#anchor linkleriyle geziliyor, client-side router
    # yok) — bu yüzden her yola index.html döndüren bir SPA rewrite'ına
    # gerek yok; dosya yoksa düz 404 yeterli.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite, /assets altındaki dosya adlarına içerik hash'i ekliyor
    # (ör. index-By1jAPaJ.js) — içerik değişince adı da değişir, o yüzden
    # bu dosyalar sonsuza kadar güvenle cache'lenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
